var IMAGES = window.__STOCK_USA_IMAGES__ || {};

function log(msg, cls){
  var el = document.getElementById('log');
  var line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
}

document.getElementById('importBtn').addEventListener('click', function(){
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  if (!email || !password) { log('Email və parolu daxil edin.', 'err'); return; }

  var btn = document.getElementById('importBtn');
  btn.disabled = true;
  document.getElementById('log').innerHTML = '';
  log('Daxil olunur...');

  firebase.auth().signInWithEmailAndPassword(email, password).then(function(){
    log('Giriş uğurlu. Firestore-a yazılır...', 'ok');
    var db = firebase.firestore();
    var batch = db.batch();
    PRODUCTS.forEach(function(p){
      var data = Object.assign({}, p.data);
      if (IMAGES[p.id]) data.imageUrl = IMAGES[p.id];
      var ref = db.collection('products').doc(p.id);
      batch.set(ref, data);
    });
    return batch.commit();
  }).then(function(){
    log('✅ 4 məhsul uğurla import olundu! admin.html-i açıb yoxlaya bilərsiniz.', 'ok');
    btn.disabled = false;
  }).catch(function(err){
    log('Xəta: ' + err.message, 'err');
    btn.disabled = false;
  });
});
</script>
